services:
  - type: web
    name: truck-weather-routing
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
